
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | plazaGrid</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/myProfile.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                plaza<span>Grid</span>
            </a>

            <a href="products.html" class="btn btn-outline-orange btn-sm">
                Continue Shopping
            </a>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-5">

        <div class="page-heading mb-4">
            <h2>My Profile</h2>
            <p class="text-muted">
                Manage your personal information.
            </p>
        </div>


        <div class="profile-card">

            <!-- Profile Header -->
            <div class="profile-header">

               

                <div>
                    <h4 id="profileName">Customer Name</h4>
                    <p class="text-muted mb-0">Customer Account</p>
                </div>

            </div>


            <hr>


            <!-- Profile Form -->
            <form id="profileForm">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="fullName" class="form-label">
                            Full Name
                        </label>

                        <input type="text" class="form-control"
                            id="fullName" required minlength="3">

                    </div>


                    <div class="col-md-6">

                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input type="email" class="form-control"
                            id="email" required>

                    </div>


                    <div class="col-md-6">

                        <label for="phone" class="form-label">
                            Phone Number
                        </label>

                        <input type="tel" class="form-control"
                            id="phone" maxlength="11"
                            pattern="03[0-9]{9}" required>

                    </div>


                    <div class="col-md-6">

                        <label for="city" class="form-label">
                            City
                        </label>

                        <input type="text" class="form-control"
                            id="city" required>

                    </div>


                    <div class="col-12">

                        <label for="address" class="form-label">
                            Complete Address
                        </label>

                        <textarea class="form-control"
                            id="address" rows="3" required></textarea>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="profile-actions mt-4">

                    <button type="button" id="editBtn"
                        class="btn btn-outline-orange">
                        Edit Profile
                    </button>

                    <button type="submit" id="saveBtn"
                        class="btn btn-orange" disabled>
                        Save Changes
                    </button>

                </div>

                <p id="successMessage" class="success-message mt-3 d-none">
                    Profile updated successfully!
                </p>

            </form>

        </div>


        <!-- Quick Links -->
        <div class="quick-links mt-4">

            <a href="my-orders.html">
              
                <span>My Orders</span>
                
            </a>

            <a href="wishlist.html">
                
                <span>My Wishlist</span>
                
            </a>

            <a href="cart.html">
              
                <span>Shopping Cart</span>
                
            </a>

        </div>

    </main>


  
</body>
</html>
